<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex" name="robots">
    <title>404 — Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            position: relative;
            background: #fff;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
        }

        #magicui-banner {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 100px;
            overflow: hidden;
            pointer-events: none;
            color: #171717;
            background-image: radial-gradient(rgba(23, 23, 23, .15) .7px, transparent .9px);
            background-size: 4px 4px;
        }

        #magicui-banner::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
        }

        #magicui-banner.grid-ready {
            background-image: none;
        }

        #magicui-grid {
            display: block;
            width: 100%;
            height: 100%;
        }

        main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 100px 24px 64px;
        }

        .error-panel {
            width: 100%;
            max-width: 448px;
            text-align: center;
        }

        h1 {
            position: relative;
            margin: 0;
            color: #ddd;
            font-family: "Courier New", Courier, monospace;
            font-size: clamp(96px, 25vw, 200px);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -.08em;
            white-space: nowrap;
        }

        h1::after {
            content: "";
            position: absolute;
            top: 35%;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
            pointer-events: none;
        }

        h2 {
            margin: 8px 0 12px;
            font-size: 36px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -1.2px;
        }

        p {
            margin: 0 auto 32px;
            max-width: 400px;
            color: #737373;
            font-size: 16px;
            line-height: 1.6;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            background: #fff;
            color: #171717;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }

        .home-button:hover {
            background: #f5f5f5;
        }

        .home-button:focus-visible {
            outline: 2px solid #171717;
            outline-offset: 4px;
        }

        .home-button svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 400px) {
            h2 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
<div aria-hidden="true" id="magicui-banner">
    <canvas id="magicui-grid"></canvas>
</div>
<main>
    <section aria-labelledby="error-title" class="error-panel">
        <h1 aria-label="Error 404">404</h1>
        <h2 id="error-title">Page Not Found</h2>
        <p>The page you're looking for doesn't exist or may have been moved.</p>
        <a class="home-button" href="./index.html">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            Go to Home
        </a>
    </section>
</main>

<script>
    // Standalone adaptation of Magic UI's FlickeringGrid (MIT, Dillion Verma).
    // All banner assets and animation code are embedded in this file.
    (() => {
        const banner = document.getElementById('magicui-banner');
        const canvas = document.getElementById('magicui-grid');
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        let width, height, cols, rows, squares, color, frame = 0, last = 0;

        function paint() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color;
            for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) {
                ctx.globalAlpha = squares[x * rows + y];
                ctx.fillRect(x * 4, y * 4, 2, 2);
            }
            ctx.globalAlpha = 1;
        }

        function resize() {
            width = banner.clientWidth;
            height = banner.clientHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cols = Math.ceil(width / 4);
            rows = Math.ceil(height / 4);
            squares = Float32Array.from({length: cols * rows}, () => Math.random() * .3);
            color = getComputedStyle(banner).color;
            paint();
            banner.classList.add('grid-ready');
        }

        function animate(time) {
            frame = 0;
            if (reduced.matches || document.hidden) return;
            if (!last) last = time;
            const delta = Math.min((time - last) / 1000, .5);
            if (delta >= .08) {
                for (let i = 0; i < squares.length; i++) if (Math.random() < .3 * delta) squares[i] = Math.random() * .3;
                paint();
                last = time;
            }
            frame = requestAnimationFrame(animate);
        }

        function restart() {
            cancelAnimationFrame(frame);
            last = 0;
            if (!reduced.matches && !document.hidden) frame = requestAnimationFrame(animate);
        }

        resize();
        restart();
        if ('ResizeObserver' in window) new ResizeObserver(resize).observe(banner);
        else window.addEventListener('resize', resize);
        reduced.addEventListener('change', restart);
        document.addEventListener('visibilitychange', restart);
        new MutationObserver(resize).observe(document.documentElement, {attributes: true, attributeFilter: ['class']});
    })();
</script>
</body>
</html>
